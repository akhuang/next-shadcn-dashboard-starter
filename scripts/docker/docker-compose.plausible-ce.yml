version: '3.9'

services:
  # PostgreSQL 数据库
  plausible_db:
    image: postgres:14-alpine
    container_name: plausible-db
    restart: unless-stopped
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    networks:
      - dashboard-network

  # ClickHouse 事件数据库
  plausible_events_db:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: plausible-events-db
    restart: unless-stopped
    volumes:
      - plausible-events-db-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - dashboard-network

  # Plausible Community Edition
  plausible:
    image: plausible/analytics:latest
    container_name: plausible-ce
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_events_db
    ports:
      - "8000:8000"
    environment:
      # 基础配置
      - BASE_URL=http://localhost:8000
      - SECRET_KEY_BASE=tZQzovXPlI5xXeDL5cJSbQL0BjV5T1PuHOOjAOauxjt/XTwFEuqLE6A+Y1xh9E5m
      
      # 数据库连接
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db
      
      # 禁用注册和邮件
      - DISABLE_REGISTRATION=invite_only
      - MAILER_ENABLED=false
      
      # 允许所有域名（开发环境）
      - ALLOW_CUSTOM_DOMAINS=true
      
    networks:
      - dashboard-network
    volumes:
      - plausible-data:/var/lib/plausible

volumes:
  plausible-db-data:
    driver: local
  plausible-events-db-data:
    driver: local
  plausible-data:
    driver: local

networks:
  dashboard-network:
    external: true