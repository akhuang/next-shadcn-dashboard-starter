version: '3.9'

services:
  # Next.js 应用 - 开发模式，直接访问
  app:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    container_name: nextjs-dashboard-app-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - TZ=Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      # 只挂载 uploads 目录
      - ../../uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s