# Next.js Dashboard Portal - Nginx Configuration
# 支持 HTTPS、反向代理和 iframe 嵌入

# 上游服务器配置
upstream dashboard_app {
    server app:3000;
    keepalive 64;
}

# HTTPS 服务器配置
server {
    listen 443 ssl http2;
    server_name _;

    # SSL 证书配置
    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头部 - 允许 iframe 嵌入
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.huawei.com" always;
    
    # 不设置 X-Frame-Options，以允许被嵌入

    # Gzip 压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 客户端配置
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # ---- 门户主应用 ----
    location / {
        proxy_pass http://dashboard_app;
        proxy_http_version 1.1;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # 标准代理头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $server_name;
        
        # 性能优化
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Next.js 静态文件优化 ----
    location /_next/static {
        proxy_pass http://dashboard_app;
        proxy_cache_valid 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- 公共静态资源 ----
    location /static {
        proxy_pass http://dashboard_app;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---- 图片和媒体文件缓存 ----
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://dashboard_app;
        proxy_cache_valid 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- API 路由（不缓存） ----
    location /api {
        proxy_pass http://dashboard_app;
        
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # 禁用缓存
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ---- 通用代理：支持代理外部服务（可选） ----
    # 示例：/proxy/example.com/path -> https://example.com/path
    location ~* ^/proxy/(?<target_host>[^/]+)(?<target_path>/.*)?$ {
        # 安全检查：只允许特定域名（根据需要修改）
        set $allowed 0;
        if ($target_host ~* \.(huawei\.com|example\.com)$) {
            set $allowed 1;
        }
        if ($allowed = 0) {
            return 403;
        }

        # 代理到目标服务
        proxy_pass https://$target_host$target_path;
        
        proxy_set_header Host              $target_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # 移除阻止 iframe 的头部
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        
        # 为 iframe 中的 Cookie 添加必要属性
        proxy_cookie_flags ~ SameSite=None Secure;
        
        # 允许被当前域嵌入
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # ---- 健康检查端点 ----
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---- 错误页面 ----
    error_page 404 /404;
    error_page 500 502 503 504 /500;
    
    location = /404 {
        proxy_pass http://dashboard_app/404;
    }
    
    location = /500 {
        proxy_pass http://dashboard_app/500;
    }
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name _;
    
    # 健康检查例外（用于容器健康检查）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 内网环境直接提供 HTTP 服务，不强制跳转 HTTPS
    location / {
        proxy_pass http://dashboard_app;
        proxy_http_version 1.1;
        
        # 标准代理头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host  $server_name;
        
        # 性能优化
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}