version: '3.9'

services:
  # Next.js Dashboard 应用
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    container_name: nextjs-dashboard-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Shanghai
      # Microsoft Clarity Analytics (Optional)
      - NEXT_PUBLIC_CLARITY_PROJECT_ID=${NEXT_PUBLIC_CLARITY_PROJECT_ID}
      # Redis 连接配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      # Excel 监控配置
      - EXCEL_WATCH_DIR=/tmp/test-contacts
      - EXCEL_WATCH_POLLING=false
      - EXCEL_WATCH_INTERVAL=1000
    networks:
      - dashboard-network
    volumes:
      # 持久化上传文件等
      - ../../uploads:/app/uploads
      # Excel 文件监控目录（简单映射）
      - ./excel-data:/tmp/test-contacts
    ports:
      # 可选：直接暴露 Next.js 端口（绕过 Nginx）
      - '${NEXTJS_PORT:-3000}:3000'
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Excel 监控服务
  excel-monitor:
    build:
      context: ../../excel-monitor-service
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    container_name: nextjs-dashboard-excel-monitor
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - EXCEL_WATCH_DIR=/data/excel-files
      - TZ=Asia/Shanghai
    volumes:
      # Excel 文件目录
      - ./excel-data:/data/excel-files
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: nextjs-dashboard-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    environment:
      - TZ=Asia/Shanghai
    networks:
      - dashboard-network
    volumes:
      - redis-data:/data
      - redis-logs:/var/log/redis
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx 反向代理和 SSL 终止
  nginx:
    image: nginx:alpine
    container_name: nextjs-dashboard-nginx
    restart: unless-stopped
    depends_on:
      - app
      - redis
    ports:
      - '${HTTP_PORT:-8088}:80'
      - '${HTTPS_PORT:-8444}:443' # HTTPS 端口
    environment:
      - TZ=Asia/Shanghai
      - HTTPS_PORT=${HTTPS_PORT:-8444}
    volumes:
      # Nginx 配置模板
      - ./nginx/portal.conf.template:/etc/nginx/templates/default.conf.template:ro
      # SSL 证书
      - ./certs:/etc/nginx/certs:ro
      # 日志
      - nginx-logs:/var/log/nginx
      # 缓存
      - nginx-cache:/var/cache/nginx
    networks:
      - dashboard-network
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选：Nginx Web UI 管理界面
  # nginx-ui:
  #   image: uozi/nginx-ui:latest
  #   container_name: nginx-ui
  #   restart: unless-stopped
  #   depends_on:
  #     - nginx
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - TZ=Asia/Shanghai
  #     - UI_AUTH=admin:changeme
  #   volumes:
  #     - ./nginx:/etc/nginx/conf.d
  #     - ./nginx-ui-data:/etc/nginx-ui
  #   networks:
  #     - dashboard-network

networks:
  dashboard-network:
    name: dashboard-network
    driver: bridge

volumes:
  nginx-logs:
    driver: local
  nginx-cache:
    driver: local
  redis-data:
    driver: local
  redis-logs:
    driver: local
