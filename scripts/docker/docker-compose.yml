version: '3.9'

services:
  # Next.js Dashboard 应用
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    container_name: nextjs-dashboard-app
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.prod   # 生产环境配置
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Shanghai
    networks:
      - dashboard-network
    volumes:
      # 持久化上传文件等
      - ../../uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理和 SSL 终止
  nginx:
    image: nginx:alpine
    container_name: nextjs-dashboard-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8444}:443"  # HTTPS 端口
    environment:
      - TZ=Asia/Shanghai
      - HTTPS_PORT=${HTTPS_PORT:-8444}
    volumes:
      # Nginx 配置模板
      - ./nginx/portal.conf.template:/etc/nginx/templates/default.conf.template:ro
      # SSL 证书
      - ./certs:/etc/nginx/certs:ro
      # 日志
      - nginx-logs:/var/log/nginx
      # 缓存
      - nginx-cache:/var/cache/nginx
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选：Nginx Web UI 管理界面
  # nginx-ui:
  #   image: uozi/nginx-ui:latest
  #   container_name: nginx-ui
  #   restart: unless-stopped
  #   depends_on:
  #     - nginx
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - TZ=Asia/Shanghai
  #     - UI_AUTH=admin:changeme
  #   volumes:
  #     - ./nginx:/etc/nginx/conf.d
  #     - ./nginx-ui-data:/etc/nginx-ui
  #   networks:
  #     - dashboard-network

networks:
  dashboard-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  nginx-logs:
    driver: local
  nginx-cache:
    driver: local