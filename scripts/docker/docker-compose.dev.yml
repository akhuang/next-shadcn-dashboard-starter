version: '3.9'

services:
  # Next.js 应用 - 开发模式
  app:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTPS_PROXY}
        - no_proxy=${NO_PROXY}
    container_name: nextjs-dashboard-app-dev
    restart: unless-stopped
    env_file:
      - .env.dev    # 开发环境配置
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - TZ=Asia/Shanghai
    networks:
      - dashboard-network-dev
    volumes:
      # 挂载源代码以支持热重载
      - ../..:/app
      # 使用 Docker volumes 提升性能
      - /app/node_modules
      - /app/.next
      - ../../uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx - 复用相同配置
  nginx:
    image: nginx:alpine
    container_name: nextjs-dashboard-nginx-dev
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${DEV_HTTP_PORT:-8089}:80"
      - "${DEV_HTTPS_PORT:-8445}:443"
    environment:
      - TZ=Asia/Shanghai
      - HTTPS_PORT=${DEV_HTTPS_PORT:-8445}
    volumes:
      - ./nginx/portal.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    networks:
      - dashboard-network-dev
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dashboard-network-dev:
    driver: bridge

volumes:
  nginx-logs:
    driver: local
  nginx-cache:
    driver: local