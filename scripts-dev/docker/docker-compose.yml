version: '3.9'

services:
  # Nginx - 复用相同配置
  nginx:
    image: nginx:alpine
    container_name: nextjs-dashboard-nginx-dev
    restart: unless-stopped
    ports:
      - '${DEV_HTTP_PORT:-8089}:80'
      - '${DEV_HTTPS_PORT:-8445}:443'
    environment:
      - TZ=Asia/Shanghai
      - HTTPS_PORT=${DEV_HTTPS_PORT:-8445}
      - DEV_SERVER_PORT=${DEV_SERVER_PORT:-3000}
    volumes:
      - ./nginx/portal.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    networks:
      - dashboard-network-dev
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dashboard-network-dev:
    driver: bridge

volumes:
  nginx-logs:
    driver: local
  nginx-cache:
    driver: local
